# /etc/nginx/sites-available/borsabot
# borsabot.ornek.com yerine kendi alan adını yaz.
# Bu dosyayı koyduktan SONRA certbot çalıştır; 443 bloğunu ve sertifika
# satırlarını certbot kendisi ekler.

server {
    listen 80;
    listen [::]:80;
    server_name borsabot.ornek.com;

    # Let's Encrypt doğrulaması
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        auth_basic off;
    }

    location / {
        # Şifre koruması: uygulamayı sadece sen açabilirsin
        auth_basic "BorsaBot";
        auth_basic_user_file /etc/nginx/.htpasswd-borsabot;

        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Streamlit WebSocket üzerinden çalışır, bu iki satır şart
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ML tahmini ve toplu analiz uzun sürebilir
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
