<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}BorsaBot Finans{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📈</text></svg>">
<script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js" crossorigin="anonymous"></script>
{# plotly yalnızca grafik olan sayfalarda yüklenir; tam paket 1,3 MB,
   finance paketi (mum + çizgi + bar) 377 KB ve ihtiyacımızın tamamı. #}
{% block head_scripts %}{% endblock %}
</head>
<body>
<div class="page">

  {% include "partials/topbar.html" %}
  {% block content %}{% endblock %}

</div>

<div id="modal"></div>

<script>
function closeModal() { document.getElementById('modal').innerHTML = ''; }

// htmx yalnızca 2xx yanıtlarda içerik değiştirir; hata durumunda hiçbir şey
// olmuyor ve kullanıcı isteğin düştüğünü anlamıyordu. Kısa bir uyarı göster.
document.body.addEventListener('htmx:responseError', function (e) {
  const code = e.detail.xhr.status;
  const msg = code === 429
    ? 'Çok sık istek gönderildi. Birkaç saniye sonra tekrar dene.'
    : 'İstek tamamlanamadı (hata ' + code + '). Tekrar dener misin?';
  showToast(msg);
});
document.body.addEventListener('htmx:sendError', function () {
  showToast('Sunucuya ulaşılamadı. Bağlantını kontrol et.');
});

let toastTimer;
function showToast(text) {
  let el = document.getElementById('gf-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'gf-toast';
    el.className = 'gf-toast';
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 5000);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// Plotly figürünü sunucudan JSON olarak alıp çizer.
async function drawChart(elId, url) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.classList.add('htmx-request');
  try {
    const res = await fetch(url);
    if (!res.ok) { el.innerHTML = '<div class="gf-empty">Grafik verisi alınamadı.</div>'; return; }
    const fig = JSON.parse(await res.json());
    Plotly.react(el, fig.data, fig.layout, {responsive: true, displaylogo: false});
  } catch (err) {
    el.innerHTML = '<div class="gf-empty">Grafik çizilemedi.</div>';
  } finally {
    el.classList.remove('htmx-request');
  }
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
