<div class="gf-topbar">
  <a href="/" class="gf-logo" style="text-decoration:none;">Borsa<b>Bot</b> Finans</a>

  <form action="/arama" method="get" style="flex:1;max-width:720px;">
    <input type="search" name="sembol" list="tum-semboller" autocomplete="off"
           placeholder="BIST veya ABD hissesi, endeks ya da sembol arayın">
    <datalist id="tum-semboller">
      {% for s in BIST100_SYMBOLS %}<option value="{{ s.replace('.IS', '') }}" label="BIST">{% endfor %}
      {% for s in US_SYMBOLS %}<option value="{{ s }}" label="ABD">{% endfor %}
    </datalist>
  </form>

  <nav style="display:flex;gap:10px;">
    <a class="btn" href="/haberler">Haberler</a>
    <a class="btn" href="/gunluk-kayit">Günlük Kayıt</a>
    <a class="btn" href="/ml-tahmin">ML Tahmin</a>
  </nav>
</div>
